# mTLS gateway. It is the only published entry point for the boundary and discovery.
#
# nginx verifies the client certificate chain against the dev CA, then forwards the verified
# certificate (URL-escaped PEM) in X-Client-Cert. The services parse the SPIFFE ID from it.
# Any X-Client-Cert the client sends is overwritten here, so a client cannot assert a workload.
# Production: SPIRE issues the certificates and the gateway is Envoy.

worker_processes 1;
events { worker_connections 256; }

http {
    server {
        listen 8443 ssl;
        server_name localhost gateway;

        ssl_certificate     /certs/gateway.pem;
        ssl_certificate_key /certs/gateway.key;
        ssl_client_certificate /certs/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /products/ {
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Host $host;
            proxy_pass http://boundary:8000;
        }

        location /api/ {
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Host $host;
            proxy_pass http://discovery:8000;
        }

        location / {
            return 404;
        }
    }
}
