# mTLS gateway. The only published entry point for the boundary and discovery.
#
# Edge: nginx verifies the client's certificate chain against the dev workload CA, then forwards the verified
# certificate (URL-escaped PEM) in X-Client-Cert. Any X-Client-Cert the client sends is overwritten here.
#
# Upstream: nginx presents the gateway's client certificate from the internal CA to each service, and verifies
# the service's certificate against that CA. A workload certificate is not from the internal CA, so a workload
# cannot reach the services directly, even from the internal network.
#
# Production: SPIRE issues the certificates and the gateway is Envoy.

worker_processes 1;
events { worker_connections 256; }

http {
    server {
        listen 8443 ssl;
        server_name localhost gateway;

        ssl_certificate     /certs/edge.pem;
        ssl_certificate_key /certs/edge.key;
        ssl_client_certificate /certs/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Upstream mTLS: this gateway's client certificate, and the internal CA that signs the services.
        proxy_ssl_certificate     /certs/client.pem;
        proxy_ssl_certificate_key /certs/client.key;
        proxy_ssl_trusted_certificate /certs/internal-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        location /products/ {
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Host $host;
            proxy_ssl_name boundary;
            proxy_ssl_server_name on;
            proxy_pass https://boundary:8443;
        }

        location /api/ {
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Host $host;
            proxy_ssl_name discovery;
            proxy_ssl_server_name on;
            proxy_pass https://discovery:8443;
        }

        location / {
            return 404;
        }
    }
}
