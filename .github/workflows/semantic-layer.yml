name: semantic-layer

on:
  push:
  pull_request:

jobs:
  semantic-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest "pandas>=2.1,<3" rdflib==7.6.0 pyshacl==0.40.2 requests

      - name: Domain, integration and contract tests
        run: make test-semantic

      - name: Semantic drift demos
        run: make semantic-drift-demo
