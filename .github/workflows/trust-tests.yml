name: trust-tests

on:
  push:
  pull_request:

jobs:
  trust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OPA 1.0.0
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.0.0

      - name: Install trust dependencies
        run: pip install -r requirements-trust.txt

      - name: Create dev keys, CA and signed fixture attestations
        run: make trust-keys

      - name: Delegation sidecars are strict (a config that drops strict mode fails here)
        run: |
          for f in tools/dev-gateway/out/agent-zt/gateway.yaml tools/dev-gateway/out/boundary-zt/gateway.yaml; do
            grep -qx "strict: true" "$f" || { echo "$f is not strict"; exit 1; }
            # Every proxy listener requires a client certificate (zero-trust-rs v0.4.3, Z5).
            grep -qx "  client_auth: required" "$f" || { echo "$f proxy does not require client certificates"; exit 1; }
            if grep -q "allow_unbound_obo: true" "$f"; then echo "$f allows bearer use"; exit 1; fi
          done
          echo "both sidecar configs are strict, and every proxy requires a client certificate"

      - name: Unit and trust tests
        run: make trust-test

      - name: Before and after demos (side-door demo starts Fuseki in Docker)
        run: make trust-demo

      - name: Agent demos (scripted agent through the governed boundary; before and after)
        run: make agent-demo
