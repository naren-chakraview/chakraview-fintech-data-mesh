# Fintech data mesh platform.
#
# Trust boundary: storage (MinIO, Iceberg catalog, Postgres, Fuseki, OPA, Elasticsearch) sits on the
# `internal` network with no published ports. Clients reach product data only through the mTLS gateway,
# which forwards to the boundary and discovery services. Credentials come from .env (see .env.example).
networks:
  internal:
    internal: true
  # Fuseki for risk-compliance. Only the boundary can reach it, so a SERVICE call cannot reach another domain's Fuseki.
  fuseki-risk:
    internal: true
  edge:
    driver: bridge

services:
  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chakra-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chakra-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  # Schema Registry
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: chakra-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    depends_on:
      - kafka

  # PostgreSQL: Iceberg catalog metadata and the grant store. Internal only.
  postgres:
    image: postgres:15
    container_name: chakra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: iceberg
    networks: [internal]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Iceberg REST Catalog. Internal only; it has no authentication of its own.
  iceberg-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: chakra-iceberg-catalog
    environment:
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      CATALOG_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CATALOG_WAREHOUSE: s3://data/warehouse
    networks: [internal]
    depends_on:
      - postgres
      - minio

  # MinIO (S3-compatible object storage). Internal only.
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: chakra-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    networks: [internal]
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: chakra-prometheus
    volumes:
      - ./platform/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: chakra-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  # OPA: internal only. The boundary and discovery are its only callers. Policies are mounted from the repo.
  opa:
    image: openpolicyagent/opa:1.0.0
    container_name: chakra-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181",
              "/policies/platform", "/policies/domains"]
    networks: [internal]
    volumes:
      - ./platform/governance/opa-policies:/policies/platform:ro
      - ./domains/risk-compliance/policy:/policies/domains/risk-compliance:ro
      - ./domains/accounts/policy:/policies/domains/accounts:ro
      - ./domains/transactions/policy:/policies/domains/transactions:ro
      - ./domains/market-data/policy:/policies/domains/market-data:ro
      - ./domains/counterparties/policy:/policies/domains/counterparties:ro

  # Elasticsearch (audit logs). Internal only.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: chakra-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    networks: [internal]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # Fuseki for the risk-compliance domain. Internal only. Runs the locked-down config:
  # query and read-only graph store, no update and no read-write graph store.
  risk-compliance-fuseki-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /fuseki-base/databases/risk_compliance && chown -R 100:101 /fuseki-base/databases"]
    volumes:
      - risk_compliance_fuseki:/fuseki-base/databases

  risk-compliance-fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: chakra-risk-compliance-fuseki
    command: ["/jena-fuseki/fuseki-server", "--conf", "/fuseki/config.ttl"]
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD in .env}
    networks: [fuseki-risk]
    depends_on:
      risk-compliance-fuseki-init:
        condition: service_completed_successfully
    volumes:
      - ./domains/risk-compliance/config/fuseki-config.ttl:/fuseki/config.ttl:ro
      - risk_compliance_fuseki:/fuseki-base/databases

  # Dev identity provider (development only). Mints RS256 tokens for named test users.
  dev-idp:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: chakra-dev-idp
    command: ["uvicorn", "serve:app", "--app-dir", "tools/dev-idp", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - ./tools/dev-idp/keys:/app/tools/dev-idp/keys:ro
    ports:
      - "127.0.0.1:8090:8090"
    networks: [internal, edge]

  # Boundary: the only network path to product data. Internal only; the gateway publishes.
  boundary:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: chakra-boundary
    environment:
      OPA_DECISION_URL: http://opa:8181/v1/data/data_mesh/access
      OPA_MASKING_URL: http://opa:8181/v1/data/data_mesh/access/masking_strategy
      ES_URL: http://elasticsearch:9200
      IDP_JWKS_URL: http://dev-idp:8090/.well-known/jwks.json
      IDP_ISSUER: http://dev-idp:8090
      IDP_AUDIENCE: data-mesh
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/iceberg
      FUSEKI_ENDPOINTS: '{"risk-compliance": "http://risk-compliance-fuseki:3030/risk_compliance/sparql"}'
      DOMAINS_DIR: /app/domains
      POLICY_ROOT: /app
      LINEAGE_DIR: /app/platform/lineage/attestations
      LINEAGE_TRUST_DIR: /app/platform/lineage/trust-config
      DELEGATION_TRUST_DIR: /config/boundary
      # Customer IRIs are minted from the customer's identity and this key (addendum W3). Dev default; production sets it.
      FINTECH_IRI_KEY: ${FINTECH_IRI_KEY:-demo-only-key-not-for-production}
      PROPOSAL_SIGNING_KEY: /run/secrets/governed-writer.key
    # Both listeners in one process: mTLS on 8443 (nginx), and loopback on 8080 (the boundary's own sidecar).
    command: ["python", "-m", "boundary.serve"]
    volumes:
      # Writable: the governed writer publishes each accepted snapshot's signed statement here. The trust config is
      # read-only, so the writer cannot change which key verifies what it wrote.
      - ./platform/lineage/attestations:/app/platform/lineage/attestations
      - ./platform/lineage/trust-config:/app/platform/lineage/trust-config:ro
      - ./platform/lineage/keys/governed-writer.key:/run/secrets/governed-writer.key:ro
      - ./tools/dev-ca/out/services/boundary:/certs:ro
      - ./tools/dev-gateway/out/boundary:/config/boundary:ro
    networks: [internal, fuseki-risk]
    depends_on:
      - opa
      - postgres
      - dev-idp
      - elasticsearch

  discovery:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: chakra-discovery
    command: ["uvicorn", "backend.main:app", "--app-dir", "platform/discovery", "--host", "0.0.0.0", "--port", "8443",
              "--ssl-keyfile", "/certs/server.key", "--ssl-certfile", "/certs/server.pem",
              "--ssl-ca-certs", "/certs/ca.pem", "--ssl-cert-reqs", "2"]
    volumes:
      - ./tools/dev-ca/out/services/discovery:/certs:ro
    environment:
      IDP_JWKS_URL: http://dev-idp:8090/.well-known/jwks.json
      IDP_ISSUER: http://dev-idp:8090
      IDP_AUDIENCE: data-mesh
      OPA_DECISION_URL: http://opa:8181/v1/data/data_mesh/access
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/iceberg
      DOMAINS_DIR: /app/domains
    networks: [internal]
    depends_on:
      - opa
      - postgres
      - dev-idp

  # mTLS gateway: verifies client certificates, forwards the verified cert to the services.
  gateway:
    image: nginx:1.27-alpine
    container_name: chakra-gateway
    volumes:
      - ./platform/boundary/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tools/dev-ca/out/services/gateway:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
    networks: [internal, edge]
    depends_on:
      - boundary
      - discovery

  # Delegation sidecars (zt-gateway), pinned to a commit of the public repo. A sidecar shares the network namespace of
  # the one workload it serves, so its loopback is that workload's alone. See
  # docs/case-study/fintech-governance/agent-gaps.md (the sidecar topology).
  boundary-zt:
    build:
      context: https://github.com/naren-chakraview/zero-trust-rs.git#v0.4.4
    container_name: chakra-boundary-zt
    network_mode: "service:boundary"
    command: ["/config/gateway.yaml"]
    volumes:
      - ./tools/dev-gateway/out/boundary-zt:/config:ro
    depends_on:
      - boundary

  # The scripted risk-review agent. It holds no credential of its own: its sidecar issues each call's token.
  agent:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: chakra-agent
    command: ["python", "/app/examples/agent-gaps/agent_runner.py"]
    environment:
      ANALYST_TOKEN_URL: http://dev-idp:8090/token/risk-analyst
      IDP_ISSUER: http://dev-idp:8090
      ADMIN_URL: https://localhost:6443
      BOUNDARY_URL: https://boundary:8444
      AGENT_SPIFFE_ID: spiffe://chakracommerce.com/ns/agents/sa/risk-review-agent
      BOUNDARY_SPIFFE_ID: spiffe://chakracommerce.com/ns/boundary/sa/boundary
      CLIENT_CERT: /certs/risk-review-agent.pem
      CLIENT_KEY: /certs/risk-review-agent.key
      CA_CERT: /certs/ca.pem
    volumes:
      - ./tools/dev-gateway/out/agent:/certs:ro
    networks: [internal]
    restart: "no"
    depends_on:
      - dev-idp
      - boundary-zt

  # The onboarding agent (the customer-intake path, addendum W3). Deterministic: see examples/agent-gaps/onboarding_mock.py.
  onboarding-agent:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: chakra-onboarding-agent
    command: ["python", "/app/examples/agent-gaps/onboarding_mock.py"]
    environment:
      IDP_TOKEN_URL: http://dev-idp:8090/token/ada-customer
      IDP_ISSUER: http://dev-idp:8090
      ADMIN_URL: https://localhost:6443
      BOUNDARY_URL: https://boundary:8444
      AGENT_SPIFFE_ID: spiffe://chakracommerce.com/ns/agents/sa/onboarding-agent
      BOUNDARY_SPIFFE_ID: spiffe://chakracommerce.com/ns/boundary/sa/boundary
      CLIENT_CERT: /certs/onboarding-agent.pem
      CLIENT_KEY: /certs/onboarding-agent.key
      CA_CERT: /certs/ca.pem
      # The mock mints the customer's IRI with the same key the boundary uses (dev default; production sets it).
      FINTECH_IRI_KEY: ${FINTECH_IRI_KEY:-demo-only-key-not-for-production}
    volumes:
      - ./tools/dev-gateway/out/onboarding:/certs:ro
    networks: [internal]
    restart: "no"
    depends_on:
      - dev-idp
      - boundary-zt

  onboarding-zt:
    build:
      context: https://github.com/naren-chakraview/zero-trust-rs.git#v0.4.4
    container_name: chakra-onboarding-zt
    network_mode: "service:onboarding-agent"
    command: ["/config/gateway.yaml"]
    volumes:
      - ./tools/dev-gateway/out/onboarding-zt:/config:ro
    depends_on:
      - onboarding-agent

  agent-zt:
    build:
      context: https://github.com/naren-chakraview/zero-trust-rs.git#v0.4.4
    container_name: chakra-agent-zt
    network_mode: "service:agent"
    command: ["/config/gateway.yaml"]
    volumes:
      - ./tools/dev-gateway/out/agent-zt:/config:ro
    depends_on:
      - agent

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  risk_compliance_fuseki:
