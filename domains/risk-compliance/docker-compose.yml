version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_compliance_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # One-shot: Fuseki runs as uid 100 and TDB2 needs its database directory to exist.
  fuseki-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /fuseki-base/databases/risk_compliance && chown -R 100:101 /fuseki-base/databases"]
    volumes:
      - jena_data:/fuseki-base/databases

  jena-fuseki:
    image: stain/jena-fuseki:5.1.0
    command: ["/jena-fuseki/fuseki-server", "--conf", "/fuseki/config.ttl"]
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD in .env}
    env_file:
      - .env
    volumes:
      - ./config/fuseki-config.ttl:/fuseki/config.ttl:ro
      - jena_data:/fuseki-base/databases
    depends_on:
      postgres:
        condition: service_healthy
      fuseki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3030/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  jena_data:
