name: risk-review-notes
version: "1.0"
owner: risk-compliance-domain
owner_email: risk@chakra.fintech
domain: risk-compliance

description: |
  Review notes on high-risk customers. Authoritative, owned by Risk. The write kind is derived and the note is
  confidential, so an agent's note is a proposal that a Risk owner accepts, rejects or rolls back. The rule that
  requires the proposal is the write-tier rule (confidential derived output from an agent), not a per-product opt-in.
  A listed producer writes directly.

tables:
  - name: review_notes
    iceberg_table: risk_compliance.review_notes
    schema_version: "1.0"
    doc: "Accepted review notes, one row per note"

sla:
  freshness:
    value: 1
    unit: day
  availability:
    value: 99.9
    unit: percent

# Write contract (addendum W1, W2): derived and confidential, so an agent's write is a proposal and a listed producer
# writes directly. Append: a note id is written once.
write_kind: derived
write_key: note_id
write_mode: append
producers: []

access_policy:
  default: deny
  approval_required: true
  approval_sla_hours: 2
  require_provenance: true
  columns:
    - name: note_id
      classification: public
    - name: customer_iri
      classification: public
    - name: risk_band
      classification: public
    - name: reviewed_note
      classification: confidential

tags: [compliance-critical, human-in-the-loop]
retention_policy:
  value: 10
  unit: years
  rationale: "AML and SOX long-term audit requirements"
