---
name: risk-scores
version: "1.0"
owner: risk-compliance-domain
owner_email: risk@chakra.fintech
domain: risk-compliance

description: |
  Fraud, AML, and counterparty risk scores. Primary input for real-time decision engines.
  Includes KYC verdicts, sanctions matches, and compliance flags.

tables:
  - name: fraud_scores
    iceberg_table: risk_compliance.fraud_scores
    schema_version: "1.0"
    partitions: [year, month, day]
    doc: "Real-time fraud risk scores per transaction"

  - name: kyc_verdicts
    iceberg_table: risk_compliance.kyc_verdicts
    schema_version: "1.0"
    partitions: [year, month]
    doc: "KYC and AML verification results"

sla:
  freshness:
    value: 10
    unit: minutes
  availability:
    value: 99.99
    unit: percent
  completeness:
    value: 100
    unit: percent

# Write contract (addendum W1, W2). Derived: a listed producer writes its sensitive output directly, and an agent
# proposes. Upsert by account_ref: a rescore replaces the row.
write_kind: derived
write_key: account_ref
write_mode: upsert
producers:
  - spiffe://chakracommerce.com/ns/risk/sa/producer

access_policy:
  default: deny
  approval_required: true
  approval_sla_hours: 2
  # A count is published only for groups of at least this many rows. The fixture is small, so this is 3; production
  # uses a larger number set by the domain.
  aggregate_min_group: 3
  columns:
    - name: account_ref
      classification: sensitive
    - name: kyc_verdict
      classification: sensitive
    - name: fraud_score
      classification: sensitive
    # Pseudonymous identifiers and the band a producer assigned. Public, so the masking floor does not hide them.
    # They are the only columns an agent acting for a person may read (see risk-scores.rego).
    - name: customer_iri
      classification: public
    - name: risk_band
      classification: public
    - name: scored_at
      classification: public

tags: [compliance-critical, real-time, regulatory]
retention_policy:
  value: 10
  unit: years
  rationale: "AML and SOX long-term audit requirements"
