# Named dev users. Development only. Production uses the company IdP (OIDC).
# `owns` lists the owning domains. An approver must own the product's domain.
users:
  analyst:
    subject: analyst@chakra.fintech
    roles: [analyst]
    owns: []
  risk-analyst:
    subject: risk.analyst@chakra.fintech
    roles: [risk_analyst]
    owns: []
  fraud-analyst:
    subject: fraud.analyst@chakra.fintech
    roles: [fraud_analyst]
    owns: []
  risk-owner:
    subject: owner@risk-compliance.chakra.fintech
    roles: [data_owner]
    owns: [risk-compliance-domain]
  accounts-owner:
    subject: owner@accounts.chakra.fintech
    roles: [data_owner]
    owns: [accounts-domain]
  # A customer. `attributes` are extra claims on the credential: the KYC identifier the customer-intake identity check
  # mints the customer's IRI from (addendum W3). Dev only.
  ada-customer:
    subject: ada@customer.test
    roles: [customer]
    owns: []
    attributes:
      kyc_id: K-1001
